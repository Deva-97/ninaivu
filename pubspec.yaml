name: ninaivu
description: "Offline-first Flutter app for managing insurance clients, policies, renewal reminders, follow-ups, and Firebase-backed sync."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_crashlytics: ^5.2.0
  google_sign_in: ^7.2.0

  sqflite: ^2.4.2+1
  path: ^1.9.1

  shared_preferences: ^2.5.5
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  connectivity_plus: ^7.1.1
  intl: ^0.20.2
  uuid: ^4.5.3
  url_launcher: ^6.3.2
  get: ^4.7.3
  workmanager: ^0.9.0+3
  crypto: ^3.0.6
  local_auth: ^2.3.0
  path_provider: ^2.1.5
  share_plus: ^12.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/app_identity/ninaivu_appicon.png

